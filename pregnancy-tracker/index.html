<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today, for two</title>
<meta name="description" content="Daily pregnancy routines, logging and gentle insights.">
<meta name="theme-color" content="#F3F0F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1726" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="For two">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F0F7; --surface:#FFFFFF; --surface-2:#EAE5F1; --line:#DCD5E6;
  --ink:#2B2340; --ink-soft:#6A6280;
  --violet:#6B4FA0; --violet-soft:#E4DCF2; --on-violet:#FFFFFF;
  --good:#2F7D5E; --good-soft:#DDF0E6;
  --caution:#9A620A; --caution-soft:#F7E9CC;
  --avoid:#B23A55; --avoid-soft:#F6DCE2;
  --serif:"Young Serif", Georgia, "Times New Roman", serif;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1C1726; --surface:#262033; --surface-2:#312A41; --line:#3D3550;
    --ink:#EEE9F6; --ink-soft:#A9A0BC;
    --violet:#B49BE0; --violet-soft:#3A2F52; --on-violet:#1C1726;
    --good:#6BC9A0; --good-soft:#1F3A30;
    --caution:#E3B25A; --caution-soft:#3E3220;
    --avoid:#F08AA2; --avoid-soft:#45232D;
    color-scheme: dark;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:8px}
.app{max-width:560px;margin:0 auto;padding:20px 18px 110px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1.2}
h2{font-size:1.5rem;margin:28px 0 12px}
h3{font-size:1.15rem}
.muted{color:var(--ink-soft)}
.small{font-size:.875rem}

/* Header */
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:1.75rem}
.date{color:var(--ink-soft);font-size:.95rem}

/* The day ring — the one bold moment */
.ring-wrap{display:grid;place-items:center;margin:18px 0 6px;position:relative}
.ring{width:min(280px,78vw);height:auto;display:block}
.ring .seg-bg{stroke:var(--surface-2)}
.ring .seg{stroke:var(--violet);transition:stroke-dasharray .45s ease}
.ring .seg.full{stroke:var(--good)}
.ring-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.ring-center .wk{font-family:var(--serif);font-size:clamp(2.4rem,11vw,3.4rem);line-height:1}
.ring-center .wk-sub{color:var(--ink-soft);font-size:.9rem;margin-top:6px}
.ring-center .done-line{margin-top:10px;font-weight:600;font-size:.95rem}
.set-due{pointer-events:auto;background:none;border:0;color:var(--violet);font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:4px}

.next{background:var(--violet-soft);border-radius:14px;padding:12px 14px;margin:14px 0 4px;display:flex;gap:10px;align-items:center}
.next strong{font-weight:600}

/* Tasks */
.tasks{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.task{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.task-main{flex:1;display:flex;align-items:center;gap:14px;background:none;border:0;padding:14px;text-align:left;min-height:64px}
.check{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.25rem;background:var(--surface-2);transition:background .2s,transform .2s}
.task.done .check{background:var(--good);color:#fff}
.task.done .t-name{color:var(--ink-soft);text-decoration:line-through;text-decoration-thickness:1px}
.t-name{font-weight:600;display:block}
.t-meta{font-size:.85rem;color:var(--ink-soft)}
.t-meta.late{color:var(--caution);font-weight:600}
.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.18)}}
.stepper{display:flex;border-left:1px solid var(--line)}
.stepper button{width:52px;border:0;background:none;font-size:1.4rem;font-weight:500}
.stepper button+button{border-left:1px solid var(--line);background:var(--violet-soft);color:var(--violet);font-weight:700}

/* Segmented control & chips */
.seg-ctl{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;margin:16px 0}
.seg-ctl button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-weight:600;color:var(--ink-soft)}
.seg-ctl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(43,35,64,.12)}
.group{margin:18px 0 6px}
.group-head{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.good{background:var(--good)} .dot.caution{background:var(--caution)} .dot.avoid{background:var(--avoid)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:.95rem;min-height:42px}
.chip.good{border-color:color-mix(in srgb,var(--good) 40%,var(--line))}
.chip.caution{border-color:color-mix(in srgb,var(--caution) 45%,var(--line))}
.chip.avoid{border-color:color-mix(in srgb,var(--avoid) 40%,var(--line))}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:var(--violet);color:var(--on-violet);border-color:var(--violet)}

.custom{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:18px;display:grid;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
label.field{display:grid;gap:4px;font-size:.875rem;color:var(--ink-soft)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--violet);color:var(--on-violet);min-height:46px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--avoid-soft);color:var(--avoid)}

/* Log list */
.log{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.log li{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.log .when{font-size:.8rem;color:var(--ink-soft);width:62px;flex:none}
.log .what{flex:1;min-width:0}
.log .what span{display:block;font-size:.85rem;color:var(--ink-soft)}
.badge{font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.caution{background:var(--caution-soft);color:var(--caution)}
.badge.avoid{background:var(--avoid-soft);color:var(--avoid)}
.x{border:0;background:none;color:var(--ink-soft);font-size:1.3rem;width:36px;height:36px;border-radius:50%}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:16px;color:var(--ink-soft);text-align:center}

/* Insights */
.notes{display:flex;flex-direction:column;gap:8px}
.note{border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.note.good{background:var(--good-soft)} .note.watch{background:var(--caution-soft)} .note.flag{background:var(--avoid-soft)}
.note .ic{font-size:1.1rem;line-height:1.4}
.note p{margin:0}
.note b{font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:140px;margin-top:12px}
.bar{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--violet);min-height:4px}
.bar.today i{background:var(--good)}
.bar small{font-size:.75rem;color:var(--ink-soft)}
.meter{height:12px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;background:var(--violet);border-radius:999px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat .n{font-family:var(--serif);font-size:2rem;line-height:1.1}
.disclaimer{font-size:.82rem;color:var(--ink-soft);margin-top:24px}

/* Settings */
.goal-edit{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.goal-edit .row input[type=text]{flex:3}
.goal-edit .row .narrow{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}

/* Nav */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:600;color:var(--ink-soft)}
nav button svg{width:24px;height:24px}
nav button[aria-current="page"]{color:var(--violet)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 14px 12px 18px;border-radius:14px;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);width:max-content;transition:opacity .2s,transform .2s;z-index:20;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--violet-soft);font-weight:700;text-decoration:underline}
@media (prefers-color-scheme: dark){.toast button{color:var(--violet)}}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>

<nav aria-label="Main">
  <div class="inner">
    <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.3 2.3 4.7-5"/></svg>Today</button>
    <button data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Log</button>
    <button data-tab="insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>Insights</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>Settings</button>
  </div>
</nav>

<div class="toast" id="toast" role="status"><span id="toast-msg"></span><button id="toast-undo" hidden>Undo</button></div>

<script>
/* ------------------------------------------------------------------
   Data
------------------------------------------------------------------- */
const STORE_KEY = 'for-two-v1';

const DEFAULT_TASKS = [
  {id:'vitamin', name:'Prenatal vitamin',        icon:'💊', target:1,  unit:'',         time:'08:00'},
  {id:'water',   name:'Water',                   icon:'💧', target:10, unit:'cups',     time:''},
  {id:'protein', name:'Protein with each meal',  icon:'🥚', target:3,  unit:'meals',    time:''},
  {id:'produce', name:'Fruits and veggies',      icon:'🥬', target:5,  unit:'servings', time:''},
  {id:'move',    name:'Move your body',          icon:'🚶‍♀️', target:1, unit:'',         time:'17:30'},
  {id:'kegel',   name:'Pelvic floor exercises',  icon:'🌸', target:1,  unit:'',         time:'20:00'},
  {id:'unwind',  name:'Ten minutes to unwind',   icon:'🫖', target:1,  unit:'',         time:'21:00'},
  {id:'sleep',   name:'In bed by 10:30',         icon:'🌙', target:1,  unit:'',         time:'22:15'}
];

// r = good | caution | avoid.  link = goal it counts toward.  caf = caffeine mg.
const LIB = [
  // Food & drink — good
  {id:'water',   kind:'eat', r:'good', name:'Water',                  link:'water',   tip:'Most pregnant people need about 8–12 cups a day.'},
  {id:'eggs',    kind:'eat', r:'good', name:'Eggs, fully cooked',     link:'protein', tip:'Protein and choline. Cook until the yolk is firm.'},
  {id:'yogurt',  kind:'eat', r:'good', name:'Greek yogurt',           link:'protein', tip:'Protein and calcium.'},
  {id:'salmon',  kind:'eat', r:'good', name:'Salmon, cooked',         link:'protein', tip:'Low-mercury omega-3s. Aim for 2–3 servings of low-mercury fish a week.'},
  {id:'chicken', kind:'eat', r:'good', name:'Chicken or lean meat',   link:'protein', tip:'Protein and iron. Cook to a safe internal temperature.'},
  {id:'beans',   kind:'eat', r:'good', name:'Beans or lentils',       link:'protein', tip:'Iron, folate and fiber in one.'},
  {id:'greens',  kind:'eat', r:'good', name:'Leafy greens',           link:'produce', tip:'Folate, iron and fiber. Wash well.'},
  {id:'berries', kind:'eat', r:'good', name:'Berries',                link:'produce', tip:'Vitamin C helps the body absorb iron.'},
  {id:'fruit',   kind:'eat', r:'good', name:'Fruit',                  link:'produce', tip:'Fiber and fluids.'},
  {id:'veg',     kind:'eat', r:'good', name:'Vegetables',             link:'produce', tip:'Fiber helps with pregnancy constipation.'},
  {id:'smoothie',kind:'eat', r:'good', name:'Fruit and spinach smoothie', link:'produce', tip:'An easy way to stack fruit, greens and fluids.'},
  {id:'grains',  kind:'eat', r:'good', name:'Whole grains',           tip:'Steady energy and fiber.'},
  {id:'milk',    kind:'eat', r:'good', name:'Milk, pasteurized',      tip:'Calcium and vitamin D.'},
  {id:'nuts',    kind:'eat', r:'good', name:'Nuts or seeds',          tip:'Healthy fats and magnesium.'},
  // In moderation
  {id:'coffee',  kind:'eat', r:'caution', name:'Coffee, 8 oz',        caf:95, tip:'About 95 mg caffeine. The usual guidance is under 200 mg a day.'},
  {id:'tea',     kind:'eat', r:'caution', name:'Black or green tea',  caf:40, tip:'About 30–50 mg caffeine a cup.'},
  {id:'cola',    kind:'eat', r:'caution', name:'Cola',                caf:35, tip:'Caffeine plus added sugar.'},
  {id:'choc',    kind:'eat', r:'caution', name:'Chocolate',           caf:15, tip:'A little caffeine. Fine in moderation.'},
  {id:'deli',    kind:'eat', r:'caution', name:'Deli meat or hot dog',tip:'Listeria risk. Heat until steaming hot before eating.'},
  {id:'tuna',    kind:'eat', r:'caution', name:'Canned light tuna',   link:'protein', tip:'Low mercury, but it counts toward the 2–3 fish servings a week. Limit albacore to 1 serving a week.'},
  {id:'sweets',  kind:'eat', r:'caution', name:'Sweets or dessert',   tip:'Fine sometimes. Keeping added sugar modest helps energy and glucose levels.'},
  {id:'fast',    kind:'eat', r:'caution', name:'Fast food',           tip:'Often high in sodium, which can add to swelling.'},
  // Best avoided
  {id:'alcohol', kind:'eat', r:'avoid', name:'Alcohol',               tip:'No amount of alcohol is known to be safe during pregnancy.'},
  {id:'raw',     kind:'eat', r:'avoid', name:'Raw fish or sushi',     tip:'Parasite and bacteria risk. Cooked and veggie rolls are fine.'},
  {id:'unpast',  kind:'eat', r:'avoid', name:'Unpasteurized cheese or milk', tip:'Listeria risk. Check labels on brie, feta, blue cheese and queso fresco.'},
  {id:'mercury', kind:'eat', r:'avoid', name:'High-mercury fish',     tip:'Shark, swordfish, king mackerel, tilefish, bigeye tuna, marlin and orange roughy.'},
  {id:'rawmeat', kind:'eat', r:'avoid', name:'Undercooked meat or eggs', tip:'Salmonella and toxoplasma risk. Includes rare steak and runny yolks.'},
  {id:'sprouts', kind:'eat', r:'avoid', name:'Raw sprouts',           tip:'Linked to E. coli and salmonella. Cooked sprouts are fine.'},
  {id:'energy',  kind:'eat', r:'avoid', name:'Energy drink',          caf:160, tip:'High caffeine plus stimulants that haven’t been studied in pregnancy.'},
  // Movement
  {id:'walk',    kind:'move', r:'good', name:'Walk',                  tip:'One of the best all-around options.'},
  {id:'pyoga',   kind:'move', r:'good', name:'Prenatal yoga',         tip:'Flexibility, breathing and stress relief.'},
  {id:'swim',    kind:'move', r:'good', name:'Swimming',              tip:'Takes pressure off joints, especially later on.'},
  {id:'bike',    kind:'move', r:'good', name:'Stationary bike',       tip:'Cardio without the fall risk of road cycling.'},
  {id:'lift',    kind:'move', r:'good', name:'Light strength training', tip:'Keep the weights moderate and avoid straining or holding your breath.'},
  {id:'pilates', kind:'move', r:'good', name:'Prenatal Pilates',      tip:'Core and pelvic floor support.'},
  {id:'stretch', kind:'move', r:'good', name:'Stretching',            tip:'Helps with back and hip tightness.'},
  {id:'hard',    kind:'move', r:'caution', name:'Intense cardio',     tip:'Usually fine if it was routine before pregnancy and the OB agrees. Use the talk test.'},
  {id:'hot',     kind:'move', r:'avoid', name:'Hot yoga or hot Pilates', tip:'Overheating is a concern, especially early in pregnancy.'},
  {id:'fall',    kind:'move', r:'avoid', name:'Skiing, snowboarding or riding', tip:'High fall risk. ACOG advises avoiding activities where falls are likely.'},
  {id:'contact', kind:'move', r:'avoid', name:'Contact sports',       tip:'Risk of a blow to the abdomen.'}
];

const RATING = {
  eat:  {good:'Good choice', caution:'In moderation', avoid:'Best avoided'},
  move: {good:'Great for pregnancy', caution:'Check with OB', avoid:'Best avoided'}
};

/* ------------------------------------------------------------------
   Storage
------------------------------------------------------------------- */
function freshState(){
  return {settings:{name:'Christina', dueDate:''}, tasks:structuredClone(DEFAULT_TASKS), days:{}};
}
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return freshState();
    const s = JSON.parse(raw);
    if(!s || !Array.isArray(s.tasks) || typeof s.days !== 'object') return freshState();
    s.settings = Object.assign({name:'Christina', dueDate:''}, s.settings || {});
    return s;
  }catch(e){ return freshState(); }
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ toast('Couldn’t save on this device. Try exporting a backup.'); }
}
let state = load();

/* ------------------------------------------------------------------
   Helpers
------------------------------------------------------------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey = () => keyOf(new Date());
const uid = () => Math.random().toString(36).slice(2,10);

function day(k = todayKey()){
  if(!state.days[k]) state.days[k] = {done:{}, logs:[], notified:{}};
  const d = state.days[k];
  d.done ||= {}; d.logs ||= []; d.notified ||= {};
  return d;
}
function lastNDays(n){
  const out = [];
  for(let i=n-1;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); out.push(d); }
  return out;
}
function fmtTime(hhmm){
  if(!hhmm) return '';
  const [h,m] = hhmm.split(':').map(Number);
  return `${((h+11)%12)+1}:${pad(m)} ${h<12?'AM':'PM'}`;
}
function fmtClock(ts){
  const d = new Date(ts);
  return fmtTime(`${pad(d.getHours())}:${pad(d.getMinutes())}`);
}
function nowMinutes(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }
function toMinutes(hhmm){ const [h,m] = hhmm.split(':').map(Number); return h*60+m; }

function progress(task, k = todayKey()){
  const v = day(k).done[task.id] || 0;
  return Math.min(1, v / Math.max(1, task.target));
}
function dayCompletion(k){
  if(!state.tasks.length) return 0;
  const d = state.days[k];
  if(!d) return 0;
  return state.tasks.reduce((a,t) => a + Math.min(1,(d.done?.[t.id]||0)/Math.max(1,t.target)), 0) / state.tasks.length;
}

function pregnancy(){
  const due = state.settings.dueDate;
  if(!due) return null;
  const [y,m,dd] = due.split('-').map(Number);
  const dueD = new Date(y, m-1, dd);
  const t = new Date(); t.setHours(0,0,0,0);
  const daysLeft = Math.round((dueD - t) / 86400000);
  const gest = 280 - daysLeft;
  if(gest < 0 || gest > 300) return {invalid:true, daysLeft};
  const week = Math.floor(gest/7), dayIn = gest % 7;
  const tri = week < 14 ? 1 : week < 28 ? 2 : 3;
  return {week, dayIn, tri, daysLeft};
}

/* ------------------------------------------------------------------
   Toast with undo
------------------------------------------------------------------- */
let toastTimer, undoFn = null;
function toast(msg, undo){
  $('#toast-msg').textContent = msg;
  undoFn = undo || null;
  $('#toast-undo').hidden = !undo;
  $('#toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 4000);
}
$('#toast-undo').addEventListener('click', () => {
  if(undoFn){ undoFn(); undoFn = null; save(); render(); }
  $('#toast').classList.remove('show');
});

/* ------------------------------------------------------------------
   Actions
------------------------------------------------------------------- */
function bump(taskId, delta){
  const d = day();
  d.done[taskId] = Math.max(0, (d.done[taskId]||0) + delta);
}
function tapTask(id){
  const t = state.tasks.find(x => x.id === id); if(!t) return;
  const d = day(); const cur = d.done[id] || 0;
  if(t.target <= 1){ d.done[id] = cur ? 0 : 1; }
  else { d.done[id] = cur + 1; }
  save(); render({pop:id});
  if(t.target <= 1 && !cur) toast(`${t.name} done`);
}
function addLog(item, minutes){
  const d = day();
  const entry = {id:uid(), ts:Date.now(), lib:item.id||null, kind:item.kind, name:item.name, r:item.r, caf:item.caf||0, min:minutes||0, tip:item.tip||''};
  d.logs.push(entry);
  let linked = item.link || (item.kind === 'move' ? 'move' : null);
  const task = linked && state.tasks.find(t => t.id === linked);
  let bumped = false;
  if(task){
    if(task.target <= 1){ if(!d.done[task.id]){ d.done[task.id] = 1; bumped = true; } }
    else { bump(task.id, 1); bumped = true; }
  }
  save(); render();
  let msg = `Logged ${item.name}`;
  if(minutes) msg += `, ${minutes} min`;
  if(item.caf) msg += ` (${item.caf} mg caffeine)`;
  if(bumped) msg += ` · counts toward ${task.name.toLowerCase()}`;
  toast(msg, () => {
    d.logs = d.logs.filter(l => l.id !== entry.id);
    if(bumped) bump(task.id, -1);
  });
}

/* ------------------------------------------------------------------
   Views
------------------------------------------------------------------- */
let tab = 'today', logMode = 'eat', moveMinutes = 30;

function ringSVG(){
  const tasks = state.tasks, n = tasks.length || 1;
  const size = 280, cx = size/2, cy = size/2, r = 118, sw = 18;
  const C = 2*Math.PI*r, gap = n > 1 ? 10 : 0, seg = C/n - gap;
  let out = `<svg class="ring" viewBox="0 0 ${size} ${size}" role="img" aria-label="Today’s goals progress">`;
  tasks.forEach((t,i) => {
    const p = progress(t);
    const rot = -90 + (360/n)*i + (gap/2)/C*360;
    out += `<circle class="seg-bg" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${seg} ${C}" transform="rotate(${rot} ${cx} ${cy})"/>`;
    if(p > 0) out += `<circle class="seg ${p>=1?'full':''}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${seg*p} ${C}" transform="rotate(${rot} ${cx} ${cy})"/>`;
  });
  return out + '</svg>';
}

function viewToday(){
  const now = new Date();
  const preg = pregnancy();
  const doneCount = state.tasks.filter(t => progress(t) >= 1).length;
  let center;
  if(preg && !preg.invalid){
    center = `<div class="wk">Week ${preg.week}</div>
      <div class="wk-sub">${preg.dayIn ? `and ${preg.dayIn} day${preg.dayIn>1?'s':''} · `:''}trimester ${preg.tri}<br>${preg.daysLeft > 0 ? `${preg.daysLeft} days to go` : preg.daysLeft === 0 ? 'Due today' : `${-preg.daysLeft} days past due`}</div>`;
  } else {
    center = `<div class="wk">Today</div><button class="set-due" data-goto="settings">Add your due date</button>`;
  }
  center += `<div class="done-line">${doneCount} of ${state.tasks.length} goals done</div>`;

  // Up next
  const nm = nowMinutes();
  const upcoming = state.tasks.filter(t => t.time && progress(t) < 1).sort((a,b) => toMinutes(a.time) - toMinutes(b.time));
  const overdue = upcoming.filter(t => toMinutes(t.time) <= nm);
  const next = upcoming.find(t => toMinutes(t.time) > nm);
  let nextHTML = '';
  if(overdue.length) nextHTML = `<div class="next"><span aria-hidden="true">⏰</span><span><strong>${esc(overdue[0].name)}</strong> was planned for ${fmtTime(overdue[0].time)}${overdue.length>1?` (+${overdue.length-1} more)`:''}</span></div>`;
  else if(next) nextHTML = `<div class="next"><span aria-hidden="true">${esc(next.icon)}</span><span>Up next: <strong>${esc(next.name)}</strong> at ${fmtTime(next.time)}</span></div>`;
  else if(doneCount === state.tasks.length && state.tasks.length) nextHTML = `<div class="next"><span aria-hidden="true">🌷</span><span><strong>Every goal done today.</strong> Rest easy.</span></div>`;

  const tasksHTML = state.tasks.map(t => {
    const v = day().done[t.id] || 0, full = v >= t.target;
    const late = t.time && !full && toMinutes(t.time) <= nm;
    const meta = [
      t.target > 1 ? `${v} of ${t.target} ${esc(t.unit||'')}`.trim() : (full ? 'Done' : 'Tap when done'),
      t.time ? `${late?'planned ':''}${fmtTime(t.time)}` : ''
    ].filter(Boolean).join(' · ');
    return `<div class="task ${full?'done':''}">
      <button class="task-main" data-act="tap" data-id="${esc(t.id)}" aria-pressed="${full}">
        <span class="check" data-check="${esc(t.id)}" aria-hidden="true">${full ? '✓' : esc(t.icon)}</span>
        <span><span class="t-name">${esc(t.name)}</span><span class="t-meta ${late?'late':''}">${meta}</span></span>
      </button>
      ${t.target > 1 ? `<div class="stepper"><button data-act="dec" data-id="${esc(t.id)}" aria-label="Remove one ${esc(t.name)}">−</button><button data-act="inc" data-id="${esc(t.id)}" aria-label="Add one ${esc(t.name)}">+</button></div>` : ''}
    </div>`;
  }).join('');

  return `<header class="top"><h1>Hi, ${esc(state.settings.name || 'there')}</h1>
      <span class="date">${now.toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric'})}</span></header>
    <div class="ring-wrap">${ringSVG()}<div class="ring-center"><div>${center}</div></div></div>
    ${nextHTML}
    <h2>Daily goals</h2>
    <div class="tasks">${tasksHTML || `<div class="empty">No goals yet. Add some in Settings.</div>`}</div>`;
}

function chipGroup(items, title, r){
  if(!items.length) return '';
  return `<div class="group"><div class="group-head"><span class="dot ${r}"></span>${title}</div>
    <div class="chips">${items.map(i => `<button class="chip ${i.r}" data-log="${i.id}">${esc(i.name)}</button>`).join('')}</div></div>`;
}

function viewLog(){
  const items = LIB.filter(i => i.kind === logMode);
  const labels = RATING[logMode];
  let picker = '';
  if(logMode === 'move'){
    picker = `<div class="group"><div class="group-head">How long?</div><div class="chips">

}

function insightsToday(){
  const notes = [];
  const d = day(), logs = d.logs;
  const t = id => state.tasks.find(x => x.id === id);
  const hour = new Date().getHours();

  const vit = t('vitamin');
  if(vit){
    if(progress(vit) >= 1) notes.push(['good','💊','<b>Prenatal vitamin taken.</b> Folic acid and iron are covered for today.']);
    else if(hour >= 12) notes.push(['watch','💊','<b>Prenatal vitamin isn’t checked off yet.</b> Taking it with food can help if it upsets your stomach.']);
  }
  const w = t('water');
  if(w){
    const v = d.done.water || 0;
    if(v >= w.target) notes.push(['good','💧',`<b>Water goal reached</b> with ${v} cups. Hydration helps with swelling, headaches and constipation.`]);
    else if(hour >= 14) notes.push(['watch','💧',`<b>${v} of ${w.target} cups of water so far.</b> A full bottle by dinner closes most of the gap.`]);
  }
  const caf = logs.reduce((a,l) => a + (l.caf||0), 0);
  if(caf > 200) notes.push(['flag','☕',`<b>${caf} mg caffeine today</b>, over the 200 mg guideline most OBs use. Decaf or herbal tea for the rest of the day keeps it in range.`]);
  else if(caf > 0) notes.push(['good','☕',`<b>${caf} mg caffeine</b>, within the 200 mg daily guideline.`]);

  const goodEats = logs.filter(l => l.kind==='eat' && l.r==='good' && l.lib!=='water');
  if(goodEats.length >= 3) notes.push(['good','🥗',`<b>${goodEats.length} nourishing choices logged.</b> ${esc(goodEats.slice(-3).map(l=>l.name).join(', '))}.`]);

  const seen = new Set();
  logs.filter(l => l.r==='avoid' && !seen.has(l.name) && seen.add(l.name)).forEach(l => {
    notes.push(['flag','⚠️',`<b>${esc(l.name)}.</b> ${esc(l.tip)} A one-off happens; if you’re worried about it, mention it to your OB.`]);
  });
  const seenC = new Set();
  logs.filter(l => l.r==='caution' && !l.caf && !seenC.has(l.name) && seenC.add(l.name)).forEach(l => {
    notes.push(['watch','👀',`<b>${esc(l.name)}.</b> ${esc(l.tip)}`]);
  });

  const moveMin = logs.filter(l => l.kind==='move').reduce((a,l)=>a+(l.min||0),0);
  if(moveMin >= 30) notes.push(['good','🚶‍♀️',`<b>${moveMin} minutes of movement today.</b> That’s a full day’s share of the weekly goal.`]);

  if(!notes.length) notes.push(['good','🌱','<b>A fresh day.</b> Insights fill in as you check off goals and log what you eat and do.']);
  return notes;
}

function streak(test){
  let n = 0; const d = new Date();
  if(!test(keyOf(d))) d.setDate(d.getDate()-1); // today not done yet doesn't break streak
  while(test(keyOf(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}

function viewInsights(){
  const notes = insightsToday();
  const order = {flag:0, watch:1, good:2};
  notes.sort((a,b) => order[a[0]] - order[b[0]]);
  const notesHTML = notes.map(([tone,ic,html]) => `<div class="note ${tone}"><span class="ic" aria-hidden="true">${ic}</span><p>${html}</p></div>`).join('');

  const days = lastNDays(7), tk = todayKey();
  const bars = days.map(d => {
    const k = keyOf(d), pct = Math.round(dayCompletion(k)*100);
    return `<div class="bar ${k===tk?'today':''}" title="${pct}%"><small>${pct}%</small><i style="height:${Math.max(3,pct)}%"></i><small>${d.toLocaleDateString(undefined,{weekday:'narrow'})}</small></div>`;
  }).join('');

  const weekMin = days.reduce((a,d) => a + (state.days[keyOf(d)]?.logs||[]).filter(l=>l.kind==='move').reduce((s,l)=>s+(l.min||0),0), 0);
  const avgCaf = Math.round(days.reduce((a,d) => a + (state.days[keyOf(d)]?.logs||[]).reduce((s,l)=>s+(l.caf||0),0), 0) / 7);
  const weekLogs = days.flatMap(d => state.days[keyOf(d)]?.logs || []).filter(l => l.kind==='eat' && l.lib!=='water');
  const goodShare = weekLogs.length ? Math.round(weekLogs.filter(l=>l.r==='good').length / weekLogs.length * 100) : null;

  const vitTask = state.tasks.find(t=>t.id==='vitamin');
  const waterTask = state.tasks.find(t=>t.id==='water');
  const vitStreak = vitTask ? streak(k => (state.days[k]?.done?.vitamin||0) >= 1) : 0;
  const waterStreak = waterTask ? streak(k => (state.days[k]?.done?.water||0) >= waterTask.target) : 0;

  return `<header class="top"><h1>Insights</h1><span class="date">Today and this week</span></header>
    <h2>Today</h2>
    <div class="notes">${notesHTML}</div>
    <h2>Last 7 days</h2>
    <div class="card"><h3>Daily goals completed</h3><div class="bars">${bars}</div></div>
    <div class="card" style="margin-top:10px">
      <h3>Movement</h3>
      <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="150" aria-valuenow="${weekMin}"><i style="width:${Math.min(100, weekMin/150*100)}%"></i></div>
      <p class="small muted" style="margin:0">${weekMin} of 150 minutes. ACOG recommends about 150 minutes of moderate activity a week, like 30 minutes on 5 days.</p>
    </div>
    <div class="stats" style="margin-top:10px">
      <div class="stat"><div class="n">${vitStreak}</div><div class="small muted">day vitamin streak</div></div>
      <div class="stat"><div class="n">${waterStreak}</div><div class="small muted">days hitting water goal</div></div>
      <div class="stat"><div class="n">${avgCaf}<span class="small"> mg</span></div><div class="small muted">average caffeine a day</div></div>
      <div class="stat"><div class="n">${goodShare===null?'–':goodShare+'%'}</div><div class="small muted">of foods logged were good choices</div></div>
    </div>
    <p class="disclaimer">These insights use general guidance from ACOG and the FDA. Every pregnancy is different, so your OB or midwife’s advice comes first, especially for exercise and any high-risk conditions.</p>`;
}

/* ------------------------------------------------------------------
   Render + events
------------------------------------------------------------------- */
function render(opts = {}){
  const app = $('#app');
  app.innerHTML = tab === 'today' ? viewToday() : tab === 'log' ? viewLog() : tab === 'insights' ? viewInsights() : viewSettings();
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  if(opts.pop){ const c = app.querySelector(`[data-check="${CSS.escape(opts.pop)}"]`); c && c.classList.add('pop'); }
  if(tab === 'settings') bindSettings();
}

document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; render(); window.scrollTo(0,0); }));

$('#app').addEventListener('click', e => {
  const el = e.target.closest('button,[data-goto]'); if(!el) return;
  const ds = el.dataset;
  if(ds.goto){ tab = ds.goto; render(); return; }
  if(ds.act === 'tap') return tapTask(ds.id);
  if(ds.act === 'inc'){ bump(ds.id, 1); save(); render({pop:ds.id}); return; }
  if(ds.act === 'dec'){ bump(ds.id, -1); save(); render(); return; }
  if(ds.mode){ logMode = ds.mode; render(); return; }
  if(ds.min){ moveMinutes = Number(ds.min); render(); return; }
  if(ds.log){ const item = LIB.find(i => i.id === ds.log); if(item) addLog(item, item.kind==='move' ? moveMinutes : 0); return; }
  if(ds.del){
    const d = day(), idx = d.logs.findIndex(l => l.id === ds.del);
    if(idx > -1){ const [gone] = d.logs.splice(idx,1); save(); render(); toast(`Removed ${gone.name}`, () => d.logs.splice(idx,0,gone)); }
    return;
  }
  if(el.id === 'c-add'){
    const name = $('#c-name').value.trim();
    if(!name){ $('#c-name').focus(); toast('Add a name first'); return; }
    const caf = Math.max(0, Number($('#c-caf')?.value || 0));
    addLog({kind:logMode, name, r:$('#c-r').value, caf, tip:''}, logMode==='move' ? moveMinutes : 0);
  }
});

function bindSettings(){
  $('#s-name').addEventListener('change', e => { state.settings.name = e.target.value.trim(); save(); });
  $('#s-due').addEventListener('change', e => { state.settings.dueDate = e.target.value; save(); toast('Due date saved'); });
  $('#goals').addEventListener('change', e => {
    const box = e.target.closest('.goal-edit'); if(!box) return;
    const t = state.tasks[Number(box.dataset.idx)], f = e.target.dataset.f;
    if(!t || !f) return;
    t[f] = f === 'target' ? Math.max(1, Math.min(30, Number(e.target.value)||1)) : e.target.value;
    save();
  });
  $('#goals').addEventListener('click', e => {
    const b = e.target.closest('[data-rm]'); if(!b) return;
    const i = Number(b.dataset.rm), [gone] = state.tasks.splice(i,1);
    save(); render(); toast(`Removed ${gone.name}`, () => state.tasks.splice(i,0,gone));
  });
  $('#s-add').addEventListener('click', () => {
    state.tasks.push({id:uid(), name:'New goal', icon:'⭐', target:1, unit:'', time:''});
    save(); render();
    const inputs = document.querySelectorAll('#goals input[data-f="name"]');
    inputs[inputs.length-1]?.select();
  });
  $('#s-defaults').addEventListener('click', () => {
    if(confirm('Replace your goals with the default list? Your history stays.')){ state.tasks = structuredClone(DEFAULT_TASKS); save(); render(); }
  });
  $('#s-notify')?.addEventListener('click', async () => {
    try{ await Notification.requestPermission(); }catch(e){}
    render();
  });
  $('#s-export').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `for-two-backup-${todayKey()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $('#s-import').addEventListener('change', e => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const s = JSON.parse(reader.result);
        if(!Array.isArray(s.tasks) || typeof s.days !== 'object') throw new Error();
        state = Object.assign(freshState(), s); save(); render(); toast('Backup imported');
      }catch(err){ toast('That file isn’t a backup from this app'); }
    };
    reader.readAsText(file);
  });
  $('#s-reset').addEventListener('click', () => {
    if(confirm('Delete all goals, logs and history on this device? Export a backup first if you want to keep it.')){
      state = freshState(); save(); render(); toast('All data cleared');
    }
  });
}

/* ------------------------------------------------------------------
   Reminders: checks every minute while the app is open
------------------------------------------------------------------- */
function checkReminders(){
  const nm = nowMinutes(), d = day();
  let changed = false;
  state.tasks.forEach(t => {
    if(!t.time || progress(t) >= 1 || d.notified[t.id]) return;
    const tm = toMinutes(t.time);
    if(nm >= tm && nm - tm < 90){
      d.notified[t.id] = true; changed = true;
      if('Notification' in window && Notification.permission === 'granted'){
        try{ new Notification(`${t.icon} ${t.name}`, {body:'Tap the app to check it off.', icon:'icon-192.png', tag:t.id}); }catch(e){}
      }
    }
  });
  if(changed) save();
  if(tab === 'today' && !document.activeElement?.matches('input,select')) render();
}
let lastDay = todayKey();
setInterval(() => {
  if(todayKey() !== lastDay){ lastDay = todayKey(); render(); }
  checkReminders();
}, 60000);
document.addEventListener('visibilitychange', () => { if(!document.hidden){ render(); checkReminders(); } });

render();
checkReminders();
</script>
